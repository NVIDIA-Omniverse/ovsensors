[project]
name = "ovsensors-examples"
version = "0.2.0"
description = "Python and C/C++ consumers of ovsensors"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ovsensors==0.2.*",
    "ovrtx==0.7.*",
    "ovstage==0.4.*",
    "numpy>=2.2,<3",
    "pillow>=12.1,<13",
]

[project.optional-dependencies]
tensor-interop = ["warp-lang==1.10.1"]

[tool.uv]
package = false
